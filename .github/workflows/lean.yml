name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Audit the earlier MahlerLean results
        run: bash scripts/check.sh
      - name: Build and audit the AnalyticGraphs workstream
        run: bash scripts/check_analytic_graphs.sh
